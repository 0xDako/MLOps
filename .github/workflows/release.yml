name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - uses: actions/cache@v4
        with:
          path: data
          key: mnist-data-v1

      - run: pip install -e ".[dev]"

      - name: Train all models
        run: python ml/train.py --model all

      - name: Export to ONNX
        run: python ml/export.py

      - name: Quality gate
        run: python ml/quality_gate.py

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/0xdako/digitpad-api:${{ github.ref_name }}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: true
          tags: ghcr.io/0xdako/digitpad-ui:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            models/*.onnx
            models/metrics.json

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/digitpad
            sed -i "s/^VERSION=.*/VERSION=${{ github.ref_name }}/" .env
            docker compose pull
            docker compose up -d

      - name: Smoke check
        run: |
          sleep 10
          curl -sf https://mlops.xdako.com/api/health
