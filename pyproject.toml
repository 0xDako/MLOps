[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitpad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "onnx",
    "onnxruntime",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "streamlit",
    "streamlit-drawable-canvas",
    "altair",
    "pandas",
    "opencv-python-headless",
    "pytest",
    "httpx",
    "ruff",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = []

[tool.ruff]
src = ["ml", "api", "ui"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["ml", "."]
markers = ["slow: slow tests that train real models (opt-in via -m slow)"]
addopts = "-m 'not slow'"
