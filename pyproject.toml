[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitpad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "onnxruntime",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "opencv-python-headless",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = []
